services:
    mariadb:
        image: mariadb:11.8.7
        container_name: mariadb_acvans
        restart: unless-stopped

        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        
        ports:
            - "3306:3306"
        
        volumes:
            - mariadb_data:/var/lib/mysql

        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
    
    redis:
        image: redis:7
        container_name: redis_acvans
        restart: unless-stopped

        ports:
            - "6379:6379"

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
    
    backend:
        container_name: backend_acvans
        build:
            context: ./Backend/projetoAcVansV5
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "8080:8080"
        environment:
            DB_URL: ${DB_URL}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            
            DB_MIGRATION_USER: ${DB_MIGRATION_USER}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}

            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}

            ADM_EMAIL_LIST: ${ADM_EMAIL_LIST}

            EMAIL_USERNAME: ${EMAIL_USERNAME}
            EMAIL_PASSWORD: ${EMAIL_PASSWORD}

            AMBIENTE_ATIVO: prod
            
            CHAVE_JWT_ACESSO: ${CHAVE_JWT_ACESSO}
            CHAVE_JWT_REFRESH: ${CHAVE_JWT_REFRESH}

            Z_API_CLIENT_TOKEN: ${Z_API_CLIENT_TOKEN}
            Z_API_INSTANCE_ID: ${Z_API_INSTANCE_ID}
            Z_API_INSTANCE_TOKEN: ${Z_API_INSTANCE_TOKEN}

            URL_SITE: ${URL_SITE}

        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_healthy
volumes:
    mariadb_data: