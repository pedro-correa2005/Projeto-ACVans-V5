services:
  backend:
    build:
      context: ./Backend/projetoAcVansV5
      dockerfile: Dockerfile.dev

    working_dir: /workspace

    command:
      - mvn
      - -B
      - spring-boot:run
      - "-Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

    volumes:
      - ./Backend/projetoAcVansV5:/workspace
      - maven_cache:/root/.m2

    ports:
      - "127.0.0.1:5005:5005"

    environment:
      AMBIENTE_ATIVO: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s
  frontend:
    build:
      context: ./Frontend/acvans-front
      dockerfile: Dockerfile.dev
    container_name: frontend_acvans
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend/acvans-front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
volumes:
  maven_cache:
  frontend_node_modules: