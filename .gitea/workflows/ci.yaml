name: ACVans CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend - Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/projetoAcVansV5
    
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      
      - name: Validar backend
        run: chmod +x mvnw && ./mvnw clean verify
  
  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/acvans-front
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/acvans-front/package-lock.json
      
      - name: Configurar npm
        run: npm install --global npm@11.6.2
      
      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint
        
      - name: Gerar build
        run: npm run build
  deploy:
    name: Deploy - VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    env:
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

    steps:
      - name: Preparar chave SSH
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Validar identidade da VPS
        run: |
          set -euo pipefail

          ssh-keyscan -T 5 -p 22 -t ed25519 100.105.196.82 \
            > "$HOME/.ssh/known_hosts" 2>/dev/null

          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F \
            'SHA256:sGEX3V3vtm4hsQp2Po+b4xqUt8cA5R4hcx0oh/jhGj4'

      - name: Executar deploy
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            acvans-deploy@100.105.196.82