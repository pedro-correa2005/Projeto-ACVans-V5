name: ACVans CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend - Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/projetoAcVansV5
    
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      
      - name: Validar backend
        run: chmod +x mvnw && ./mvnw clean verify
  
  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/acvans-front
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/acvans-front/package-lock.json
      
      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint
        
      - name: Gerar build
        run: npm run build
