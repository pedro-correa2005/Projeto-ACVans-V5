spring.application.name=projetoAcVansV5

app.base-url=${URL_SITE}
app.adm-email-list=${ADM_EMAIL_LIST}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.servlet.session.persistent=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

jwt.access.secret=${CHAVE_JWT_ACESSO}
jwt.refresh.secret=${CHAVE_JWT_REFRESH}

spring.profiles.active=${AMBIENTE_ATIVO}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

z-api.clientToken=${Z_API_CLIENT_TOKEN}
z-api.instanceId=${Z_API_INSTANCE_ID}
z-api.instanceToken=${Z_API_INSTANCE_TOKEN}
